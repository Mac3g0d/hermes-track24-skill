[project]
name = "hermes-track24-skill"
version = "1.1.0"
description = "Hermes Agent skill that reads public Track24 parcel status"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["skills/track24-parcel-tracking/scripts", "tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
markers = [
    "integration: exercises the tracker over a real loopback HTTP server",
]
