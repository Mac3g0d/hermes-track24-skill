name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  TRIVY_VERSION: "0.75.0"

jobs:
  quality:
    name: tox (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [lint, type, security]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install tox --with tox-uv
      - run: tox -e ${{ matrix.env }}

  tests:
    name: tox (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install tox --with tox-uv
      - run: tox -e ${{ matrix.python-version }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Scan git history
        run: ./gitleaks git --no-banner --redact -v .

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" trivy
      - name: Scan dependencies, secrets and configuration
        run: ./trivy fs --scanners vuln,secret,misconfig --include-dev-deps --exit-code 1 .
